spring.application.name=query-service
server.port=8082

#Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/ledger_read_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.profiles.active=${SPRING_PROFILE:local}

#Eureka
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval=5
eureka.instance.instance-id=${spring.application.name}:${server.port}

#redis
redis.host=${REDIS_HOST:localhost}
#actuator
management.endpoints.web.exposure.include=*

#kafka
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}

# Deserialization Pipeline Configurations:
# Reads the record partition key string straight out of raw network bytes
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Configures Spring to parse the message value layout body as pure JSON data
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# The Consumer Group ID: Acts as the unique cluster name for tracking our read-marker offsets inside Kafka
spring.kafka.consumer.group-id=query-service-group

# Security Shield Bypass: Allows JSON to construct data shapes without package namespace checking (safe for local development setup)
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# Explicit Class Mapping: Tells the consumer exactly what DTO blueprint it should force the incoming JSON into
spring.kafka.consumer.properties.spring.json.value.default.type=com.query_service.WalletQueryService.dto.KafkaCdcObject

# Cold-Start Rule: If this specific group ID doesn't have a bookmark yet, read the whole log history from the very beginning
spring.kafka.consumer.auto-offset-reset=earliest