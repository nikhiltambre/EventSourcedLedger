spring.application.name=command-service
server.port=8081

#Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/ledger_write_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.profiles.active=${SPRING_PROFILE:local}

#Eureka
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval=5
eureka.instance.instance-id=${spring.application.name}:${server.port}

#redis
redis.host=${REDIS_HOST:localhost}
#actuator
management.endpoints.web.exposure.include=*